version: '3'

services:

  rabbit-broker:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=dripline
      - RABBITMQ_DEFAULT_PASS=dripline

  scpi-device:
    image: python:3.12.1-slim-bookworm
    volumes:
      - ./scpi_device.py:/root/scpi_device.py
    command: 
      - /root/scpi_device.py
      - scpi-device

#  scpi-client:
#    image: python:3.12.1-slim-bookworm
#    depends_on:
#      - scpi-device
#    volumes:
#      - ./test_scpi_client.py:/root/test_scpi_client.py
#    command: 
#      - /root/test_scpi_client.py
#      - scpi-device

  scpi-service:
    image: driplineorg/dripline-python:develop-dev
    depends_on:
      - rabbit-broker
      - scpi-device
    environment:
      DRIPLINE_USER: dripline
      DRIPLINE_PASSWORD: dripline
    volumes:
      - ./dripline_mesh.yaml:/root/.dripline_mesh.yaml
      - ./scpi-device.yaml:/root/scpi-device.yaml
    command:
      - dl-serve
      - -vvv
      - -c
      - /root/scpi-device.yaml
